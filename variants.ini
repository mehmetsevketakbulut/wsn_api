[custom_topology:chess]
# 1. Macro Grid & Cylindrical Topology
maxRank = 10
maxFile = 10
cylinder = true

# 2. Dynamic Node Injection
drop = true

# 3. Disable Standard Pieces
pawn = -
knight = -
bishop = -
rook = -
queen = -

# 4. Custom Node & Signal Characteristics (Betza Vectors)
customPiece1 = s:K   # Edge Node: Omnidirectional 1-step range
customPiece2 = r:W3  # Router: Orthogonal up to 3-hop range
customPiece3 = d:DA  # Gateway: Diagonal 2-square jump relay
customPiece4 = j:I   # Blocker: Immobile obstacle node

# 5. Collection Zone (Promotion Region)
promotionPieceTypes = srd
promotionRegionWhite = e5,e6,f5,f6
promotionRegionBlack = e5,e6,f5,f6

# 6. Initial Topology Layout & Reserve Pool
startFen = 10/1d1j2j1d1/2s4s2/3r2r3/10/10/3R2R3/2S4S2/1D1J2J1D1/10[SSSRRRDDD] w - - 0 1
