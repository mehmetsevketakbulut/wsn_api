<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="scen_page_title">Scenario & FEN Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Cascadia+Code&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0b18;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #121528;
            border-radius: 12px;
            border: 1px solid #ffffff15;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #00d2ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* --- BUTTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(135deg, #1976D2, #0D47A1);
            color: #fff;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #00c853, #64dd17);
            color: #000;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 200, 83, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #d32f2f, #f44336);
            color: #fff;
        }
        .btn-secondary {
            background: #23273a;
            color: #ccc;
            border: 1px solid #ffffff18;
        }
        .lang-btn {
            background: transparent;
            color: #00d2ff;
            border: 1px solid #00d2ff55;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
        }
        .lang-btn:hover { background: #00d2ff22; }

        /* --- CONTAINER & GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .panel {
            background: #121528;
            border: 1px solid #ffffff15;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .panel h2 {
            font-size: 16px;
            color: #00d2ff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
        }

        /* --- FORMS --- */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            background: #0a0b18;
            color: #fff;
            border: 1px solid #ffffff20;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: #00d2ff; }
        textarea.form-control { font-family: 'Cascadia Code', monospace; resize: vertical; }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* --- SCENARIO CARDS --- */
        .scen-card {
            background: #0a0b18;
            border: 1px solid #ffffff15;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .scen-card:hover { border-color: #00d2ff55; transform: translateY(-1px); }
        .scen-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .scen-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            background: #00d2ff22;
            color: #00d2ff;
            border: 1px solid #00d2ff44;
            margin-left: 6px;
        }
        .scen-fen {
            font-family: 'Cascadia Code', monospace;
            font-size: 11px;
            color: #ffeb3b;
            background: #0004;
            padding: 6px 8px;
            border-radius: 4px;
            word-break: break-all;
            margin: 8px 0;
            line-height: 1.4;
        }
        .scen-notes {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .scen-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #ffffff0d;
            padding-top: 8px;
        }
        .scen-date {
            font-size: 11px;
            color: #555;
        }
        .scen-actions {
            display: flex;
            gap: 6px;
        }

        /* --- TOAST --- */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #00c853;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- === HEADER === -->
    <div class="header">
        <div class="header-title">
            <span>🛰️</span>
            <span data-i18n="scen_head_title">Scenario & FEN Management Panel</span>
        </div>
        <div class="header-actions">
            <button class="lang-btn" id="lang-btn" onclick="toggleLanguage()">TR</button>
            <a href="index.html" class="btn btn-primary" data-i18n="btn_back_to_board">
                ⬅ Back to Main Board
            </a>
        </div>
    </div>

    <!-- === GRID CONTAINER === -->
    <div class="grid-container">

        <!-- ================= PANEL 1: ADD NEW SCENARIO ================= -->
        <div class="panel">
            <h2>➕ <span data-i18n="add_scen_title">Add & Save Scenario / FEN</span></h2>
            <p class="panel-desc" data-i18n="add_scen_desc">Copy and paste your FEN string directly below to save it into your scenario pool.</p>

            <div class="form-group">
                <label data-i18n="lbl_scen_name">Scenario / Network Name:</label>
                <input type="text" id="scen-name" class="form-control" placeholder="e.g., Sensor Bottleneck 1">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label style="margin-bottom: 0;" data-i18n="lbl_fen">FEN Layout (Copy-Paste):</label>
                    <button type="button" class="btn btn-secondary" style="padding: 3px 10px; font-size: 11px;" onclick="pasteFenFromClipboard()" data-i18n="btn_paste_fen">📋 Paste from Clipboard</button>
                </div>
                <textarea id="scen-fen" class="form-control" rows="3" placeholder="e.g., rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"></textarea>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label data-i18n="lbl_variant_type">Variant Type:</label>
                    <select id="scen-variant" class="form-control" onchange="handleVariantTypeChange()">
                        <option value="chess" data-i18n="opt_v_chess">Standard Chess</option>
                        <option value="shatranj" data-i18n="opt_v_nizami">Shatranj (Ferz/Alfil Rules)</option>
                        <option value="capablanca" data-i18n="opt_v_capablanca">Capablanca Chess (10x8)</option>
                        <option value="crazyhouse" data-i18n="opt_v_crazyhouse">Crazyhouse (Node Injection)</option>
                        <option value="xiangqi" data-i18n="opt_v_xiangqi">Xiangqi - Chinese Chess (10x9)</option>
                        <option value="custom" data-i18n="opt_v_custom">Custom Topology</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="lbl_grid_dim">Grid Size (Rank × File):</label>
                    <div style="display: flex; gap: 6px; align-items: center;">
                        <input type="number" id="scen-rank" class="form-control" min="4" max="16" value="8" style="text-align:center;">
                        <span style="color:#777;">×</span>
                        <input type="number" id="scen-file" class="form-control" min="4" max="16" value="8" style="text-align:center;">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label data-i18n="lbl_notes">Description / Notes (Optional):</label>
                <input type="text" id="scen-notes" class="form-control" placeholder="e.g., 2 isolated sensor nodes, high-priority routing">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 16px;">
                <button class="btn btn-success" style="flex: 2;" onclick="saveScenario()" data-i18n="btn_save_scen">
                    💾 Save Scenario
                </button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="clearScenarioForm()" data-i18n="btn_clear_form">
                    🧹 Clear
                </button>
            </div>
        </div>

        <!-- ================= PANEL 2: SAVED SCENARIOS ================= -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <h2>📂 <span data-i18n="saved_pool_title">Saved Scenarios & FEN Pool</span> (<span id="scen-count">0</span>)</h2>
            </div>
            <p class="panel-desc" data-i18n="saved_pool_desc">Saved scenarios will immediately appear in the variant dropdown on the main board.</p>

            <div class="form-group">
                <input type="text" id="search-input" class="form-control" oninput="renderScenarioList()" placeholder="🔍 Search scenarios...">
            </div>

            <div id="scenarios-list" style="max-height: 520px; overflow-y: auto; padding-right: 4px;">
                <!-- Dynamic list loaded here -->
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        let currentLang = localStorage.getItem("app_lang") || "en";
        let langCatalog = {};

        async function loadLanguageCatalog() {
            try {
                const resp = await fetch("lang/lang.json");
                if (!resp.ok) throw new Error("Failed to load lang/lang.json");
                langCatalog = await resp.json();
                applyTranslations();
            } catch (err) {
                console.error("Language catalog load error:", err);
            }
        }

        function t(key) {
            const entry = langCatalog[key];
            if (entry && typeof entry === "object") {
                return entry[currentLang] || entry["en"] || key;
            }
            return key;
        }

        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                const translated = t(key);
                if (translated && translated !== key) {
                    if (el.tagName === "TITLE") {
                        document.title = translated;
                    } else {
                        el.textContent = translated;
                    }
                }
            });
            document.getElementById("lang-btn").textContent = currentLang === "tr" ? "EN" : "TR";
            document.getElementById("scen-name").placeholder = t("ph_scen_name");
            document.getElementById("scen-fen").placeholder = t("ph_fen");
            document.getElementById("scen-notes").placeholder = t("ph_notes");
            document.getElementById("search-input").placeholder = t("search_placeholder");
            renderScenarioList();
        }

        function toggleLanguage() {
            currentLang = currentLang === "tr" ? "en" : "tr";
            localStorage.setItem("app_lang", currentLang);
            applyTranslations();
        }

        const SEED_SCENARIOS = [
            {
                id: "custom_seed_1",
                name: "Critical Node Analysis (Endgame Test)",
                name_tr: "Kritik Ağ Düğümü (Oyun Sonu Testi)",
                name_en: "Critical Node Analysis (Endgame Test)",
                fen: "8/8/4k3/8/8/3K4/4P3/8 w - - 0 1",
                variant: "chess",
                maxRank: 8,
                maxFile: 8,
                notes: "Single-relay bottleneck optimization test.",
                notes_tr: "Tek piyon geçişli kritik düğüm optimizasyon testi.",
                notes_en: "Single-relay bottleneck optimization test.",
                date: "2026-10-20"
            },
            {
                id: "custom_seed_2",
                name: "Extended Network Topology (Capablanca)",
                name_tr: "Genişletilmiş Ağ Topolojisi (Capablanca)",
                name_en: "Extended Network Topology (Capablanca)",
                fen: "rnabqkbcnr/pppppppppp/10/10/10/10/PPPPPPPPPP/RNABQKBCNR w KQkq - 0 1",
                variant: "capablanca",
                maxRank: 8,
                maxFile: 10,
                notes: "10x8 extended node layout (Archbishop & Chancellor nodes).",
                notes_tr: "10x8 genişletilmiş düğüm dağılımı (Archbishop & Chancellor düğümleri).",
                notes_en: "10x8 extended node layout (Archbishop & Chancellor nodes).",
                date: "2026-10-20"
            }
        ];

        function initializeDefaultScenarios() {
            let saved = JSON.parse(localStorage.getItem("saved_scenarios") || "null");
            if (!saved || saved.length === 0) {
                localStorage.setItem("saved_scenarios", JSON.stringify(SEED_SCENARIOS));
            } else {
                let changed = false;
                saved = saved.map(item => {
                    const seedMatch = SEED_SCENARIOS.find(s => s.id === item.id);
                    if (seedMatch && (!item.name_en || !item.notes_en)) {
                        changed = true;
                        return { ...item, ...seedMatch };
                    }
                    return item;
                });
                if (changed) {
                    localStorage.setItem("saved_scenarios", JSON.stringify(saved));
                }
            }
        }

        function handleVariantTypeChange() {
            const val = document.getElementById("scen-variant").value;
            const rankInput = document.getElementById("scen-rank");
            const fileInput = document.getElementById("scen-file");
            if (val === "capablanca") {
                rankInput.value = 8;
                fileInput.value = 10;
            } else if (val === "xiangqi") {
                rankInput.value = 10;
                fileInput.value = 9;
            } else {
                rankInput.value = 8;
                fileInput.value = 8;
            }
        }

        async function pasteFenFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text && text.trim()) {
                    document.getElementById("scen-fen").value = text.trim();
                    showToast(t("toast_pasted"));
                }
            } catch (err) {
                document.getElementById("scen-fen").focus();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        function clearScenarioForm() {
            document.getElementById("scen-name").value = "";
            document.getElementById("scen-fen").value = "";
            document.getElementById("scen-notes").value = "";
            document.getElementById("scen-variant").value = "chess";
            document.getElementById("scen-rank").value = "8";
            document.getElementById("scen-file").value = "8";
        }

        function saveScenario() {
            const name = document.getElementById("scen-name").value.trim();
            const fen = document.getElementById("scen-fen").value.trim();
            const variant = document.getElementById("scen-variant").value;
            const rank = parseInt(document.getElementById("scen-rank").value) || 8;
            const file = parseInt(document.getElementById("scen-file").value) || 8;
            const notes = document.getElementById("scen-notes").value.trim();

            if (!name) {
                alert(t("err_no_name"));
                return;
            }
            if (!fen) {
                alert(t("err_no_fen"));
                return;
            }

            const newScenario = {
                id: "custom_" + Date.now(),
                name: name,
                name_tr: name,
                name_en: name,
                fen: fen,
                variant: variant,
                maxRank: rank,
                maxFile: file,
                notes: notes,
                notes_tr: notes,
                notes_en: notes,
                date: new Date().toLocaleDateString()
            };

            const saved = JSON.parse(localStorage.getItem("saved_scenarios") || "[]");
            saved.unshift(newScenario);
            localStorage.setItem("saved_scenarios", JSON.stringify(saved));

            showToast(t("toast_saved"));
            clearScenarioForm();
            renderScenarioList();
        }

        function deleteScenario(id) {
            if (!confirm(t("confirm_delete"))) return;
            let saved = JSON.parse(localStorage.getItem("saved_scenarios") || "[]");
            saved = saved.filter(s => s.id !== id);
            localStorage.setItem("saved_scenarios", JSON.stringify(saved));
            showToast(t("toast_deleted"));
            renderScenarioList();
        }

        function launchScenarioOnBoard(id) {
            localStorage.setItem("active_scenario", id);
            window.location.href = "index.html";
        }

        function copyFenToClipboard(fen, btn) {
            navigator.clipboard.writeText(fen).then(() => {
                const previousLabel = btn.textContent;
                btn.textContent = t("copied_fen");
                setTimeout(() => { btn.textContent = previousLabel; }, 1500);
            });
        }

        function getScenarioTitle(scenario) {
            return currentLang === "tr" ? (scenario.name_tr || scenario.name) : (scenario.name_en || scenario.name);
        }

        function getScenarioNotes(scenario) {
            return currentLang === "tr"
                ? (scenario.notes_tr !== undefined ? scenario.notes_tr : scenario.notes)
                : (scenario.notes_en !== undefined ? scenario.notes_en : scenario.notes);
        }

        function formatVariantBadgeLabel(rawVariant) {
            const key = String(rawVariant || "").toLowerCase().trim();
            const isTR = currentLang === "tr";
            const map = {
                chess: isTR ? "Klasik Satranç" : "Standard Chess",
                shatranj: isTR ? "Şatranç (Nizami)" : "Shatranj",
                capablanca: "Capablanca",
                crazyhouse: "Crazyhouse",
                xiangqi: "Xiangqi",
                custom: isTR ? "Özel Topoloji" : "Custom Topology"
            };
            return map[key] || rawVariant;
        }

        function renderScenarioList() {
            const container = document.getElementById("scenarios-list");
            const filterQuery = (document.getElementById("search-input").value || "").toLowerCase();
            const saved = JSON.parse(localStorage.getItem("saved_scenarios") || "[]");

            document.getElementById("scen-count").textContent = saved.length;

            const filtered = saved.filter(item => {
                const title = getScenarioTitle(item).toLowerCase();
                const notes = (getScenarioNotes(item) || "").toLowerCase();
                const fen = (item.fen || "").toLowerCase();
                return title.includes(filterQuery) || fen.includes(filterQuery) || notes.includes(filterQuery);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px 10px; color: #666; font-size: 13px;">${t("empty_pool")}</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const title = getScenarioTitle(item);
                const notes = getScenarioNotes(item);
                const variantLabel = formatVariantBadgeLabel(item.variant);
                return `
                <div class="scen-card">
                    <div class="scen-header">
                        <div class="scen-title">
                            ${title}
                            <span class="badge">${item.maxRank}×${item.maxFile}</span>
                            <span class="badge" style="background:#ff980022; color:#ff9800; border-color:#ff980044;">${variantLabel}</span>
                        </div>
                    </div>
                    <div class="scen-fen">${item.fen}</div>
                    ${notes ? `<div class="scen-notes">💬 ${notes}</div>` : ''}
                    <div class="scen-footer">
                        <div class="scen-date">📅 ${item.date || "-"}</div>
                        <div class="scen-actions">
                            <button class="btn btn-secondary" style="padding: 5px 10px; font-size: 11px;" onclick="copyFenToClipboard('${item.fen}', this)">${t("btn_copy_fen")}</button>
                            <button class="btn btn-danger" style="padding: 5px 10px; font-size: 11px;" onclick="deleteScenario('${item.id}')">🗑️</button>
                            <button class="btn btn-success" style="padding: 5px 12px; font-size: 11px;" onclick="launchScenarioOnBoard('${item.id}')">${t("btn_play_on_board")}</button>
                        </div>
                    </div>
                </div>
            `}).join("");
        }

        // Initialize
        initializeDefaultScenarios();
        loadLanguageCatalog();
        window.addEventListener("storage", (e) => {
            if (e.key === "app_lang" && e.newValue && e.newValue !== currentLang) {
                currentLang = e.newValue;
                applyTranslations();
            } else if (e.key === "saved_scenarios") {
                renderScenarioList();
            }
        });
    </script>
</body>
</html>
